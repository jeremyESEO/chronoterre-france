name: Qualité et rejeu Île-de-France
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Les tests nationaux sont exécutés dans ci.yml après installation et restauration.
      - run: python -m unittest discover -s tests -p test_quality.py -v
      - run: python src/pipeline.py --offline --verify-replay
      - run: python src/demo_rejection.py
