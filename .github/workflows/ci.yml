name: Qualite ChronoTerre France
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-france.txt
      - run: python -m national.restore
      - run: python -m unittest discover -s tests -v
      - run: python -m national.demo
      - run: python -m national.analyses
